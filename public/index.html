<!doctype html>
<html lang="de" data-theme="hub">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Reisen</title>
  <meta name="description" content="Alle Reisen: Tagesplan, Karte mit allen Tipps, Wetter und Checklisten.">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Reisen">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/app.css?v=11">
  <!-- Neue Reise: Datei in assets/trips/ anlegen und hier + in sw.js (PRECACHE) eintragen -->
  <script src="/assets/trips/florenz.js?v=11" defer></script>
  <script src="/assets/trips/irland.js?v=11" defer></script>
  <script src="/assets/app.js?v=11" defer></script>
</head>
<body>
  <!-- Kompakte Titelleiste (Handy), erscheint beim Scrollen -->
  <div class="navbar" id="navbar" aria-hidden="true">
    <a class="nav-back" id="navBack" href="/" hidden><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#chevron-left"/></svg>Reisen</a>
    <div class="nav-title" id="navTitle">Reisen</div>
  </div>

  <header class="top">
    <div class="wrap">
      <a class="back" id="back" href="/" hidden><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#chevron-left"/></svg>Reisen</a>
      <div class="titlebar">
        <div>
          <p class="eyebrow" id="eyebrow"></p>
          <h1 id="title">Reisen</h1>
          <p class="sub" id="subtitle"></p>
        </div>
        <img class="appicon" id="heroIcon" src="/icons/reisen.svg" alt="" width="60" height="60">
      </div>
      <div class="status" id="status"></div>
    </div>
  </header>

  <!-- ========= ÜBERSICHT ========= -->
  <div id="hubView">
    <main class="wrap">
      <div id="hubList"></div>
    </main>
  </div>

  <!-- ========= REISE ========= -->
  <div id="tripView" hidden>
    <nav class="tabs" aria-label="Bereiche">
      <div class="wrap">
        <div class="tablist" role="tablist">
          <button class="tab" role="tab" id="tab-plan" aria-controls="plan" aria-selected="true"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#calendar-days"/></svg>Plan</button>
          <button class="tab" role="tab" id="tab-entdecken" aria-controls="entdecken" aria-selected="false"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#map"/></svg>Entdecken</button>
          <button class="tab" role="tab" id="tab-infos" aria-controls="infos" aria-selected="false"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#list-checks"/></svg>Infos</button>
        </div>
      </div>
    </nav>

    <main class="wrap">
      <!-- Plan -->
      <section class="panel" id="plan" role="tabpanel" aria-labelledby="tab-plan">
        <div class="section" id="noticeBox" hidden>
          <div class="notice"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#pencil-line"/></svg><span id="notice"></span></div>
        </div>
        <div class="section" id="nowBox" hidden></div>
        <div class="section"><div class="list facts" id="facts"></div></div>

        <div class="section">
          <div class="section-head"><h2 id="wxTitle">Wetter</h2><span class="muted" id="wxUpdated">lädt …</span></div>
          <div class="card weather" id="weather"><div class="wx-empty">Hole Vorhersage …</div></div>
        </div>

        <div class="section">
          <div class="section-head"><h2>Tag für Tag</h2><span class="muted" id="cost"></span></div>
          <nav class="daynav" id="daynav" aria-label="Tage"></nav>
          <div class="days" id="days"></div>
        </div>
      </section>

      <!-- Entdecken -->
      <section class="panel" id="entdecken" role="tabpanel" aria-labelledby="tab-entdecken" hidden>
        <div class="mapbox">
          <div id="map" role="region" aria-label="Karte"></div>
          <div class="maptools">
            <button class="float" type="button" id="nearBtn" aria-pressed="false">In der Nähe</button>
            <button class="float round" type="button" id="locateBtn" aria-label="Mein Standort" title="Mein Standort"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#locate-fixed"/></svg></button>
          </div>
        </div>

        <div class="filters">
          <div class="search">
            <svg class="i" aria-hidden="true"><use href="/assets/icons.svg#search"/></svg>
            <label class="visually-hidden" for="q">Suche</label>
            <input id="q" type="search" placeholder="Suchen" autocomplete="off" enterkeyhint="search">
          </div>
          <div class="segmented city" id="city" role="group" aria-label="Stadt" hidden></div>
          <div class="segmented" id="sort" role="group" aria-label="Sortierung">
            <button type="button" data-sort="cat" aria-pressed="true">Thema</button>
            <button type="button" data-sort="dist" aria-pressed="false">Entfernung</button>
            <button type="button" data-sort="rating" aria-pressed="false">Bewertung</button>
          </div>
          <div class="chips" id="chips"></div>
        </div>

        <div class="count" id="count" aria-live="polite"></div>
        <div id="list"></div>
      </section>

      <!-- Infos -->
      <section class="panel" id="infos" role="tabpanel" aria-labelledby="tab-infos" hidden>
        <div class="section"><div class="group-label">Unterkunft</div><div class="list" id="hotel"></div></div>
        <div class="section infos-2" id="checklists"></div>
        <div class="section"><div class="group-label">Gut zu wissen</div><div class="list" id="infolist"></div></div>
        <div class="section"><div class="group-label">Teilen & Kalender</div><div class="list" id="tools"></div></div>
      </section>
    </main>
  </div>

  <!-- Detailblatt für Orte -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <div class="sheet-grab" aria-hidden="true"></div>
      <button class="sheet-close" type="button" data-close aria-label="Schließen"><svg class="i" aria-hidden="true"><use href="/assets/icons.svg#x"/></svg></button>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <footer class="wrap">
    Wetter: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> ·
    Karte: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> ·
    Icons: <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> · Fotos: Wikimedia Commons
  </footer>
</body>
</html>
